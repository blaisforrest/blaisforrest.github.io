<html lang="en">
<head>

<title>Keebler Meadows Neighbors</title>
<meta name="description" content="Zoomable lot map of Keebler Meadows for keeping track of the neighbors you meet.">

<meta name="theme-color" content="#182120" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Keebler">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
@font-face{font-family:"Barlow";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
[hidden]{display:none!important}
html{-webkit-tap-highlight-color:transparent}
/* Layout: slim header over a full-bleed plat map. Lots are tap targets on the map;
   the household record opens in a bottom sheet on phones and a side panel on wide screens. */
:root {
  --bg: #EEF1EA;
  --surface: #FBFCF9;
  --surface-2: #F0F3EA;
  --ink: #1B2620;
  --muted: #566359;
  --line: #D3DACB;
  --canvas: #27342B;
  --accent: #C94410;
  --accent-ink: #FFFFFF;
  --teal: #1B766F;
  --teal-ink: #FFFFFF;
  --danger: #B3261E;
  --shadow: 0 10px 30px rgba(18, 30, 22, .22);
  /* map overlays sit on the photo, which looks the same in both themes */
  --ring: rgba(27, 38, 32, .55);
  --ring-fill: rgba(255, 255, 255, .20);
  --halo: rgba(255, 255, 255, .95);
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1512; --surface: #182120; --surface-2: #202B28; --ink: #E7EEE8; --muted: #98A89E;
    --line: #2C3A36; --canvas: #0B110E; --accent: #FF8B4D; --accent-ink: #1A0E06;
    --teal: #55C9C0; --teal-ink: #07211F; --danger: #FF8A80; --shadow: 0 10px 30px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1512; --surface: #182120; --surface-2: #202B28; --ink: #E7EEE8; --muted: #98A89E;
  --line: #2C3A36; --canvas: #0B110E; --accent: #FF8B4D; --accent-ink: #1A0E06;
  --teal: #55C9C0; --teal-ink: #07211F; --danger: #FF8A80; --shadow: 0 10px 30px rgba(0, 0, 0, .55);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; }
body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.4; -webkit-text-size-adjust: 100%; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: flex; flex-direction: column; }

/* ---------- header ---------- */
.top { position: relative; z-index: 30; display: grid; gap: 8px 12px; padding: 10px 16px;
  grid-template-columns: 1fr auto; grid-template-areas: "brand btn" "search search";
  background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { grid-area: brand; min-width: 0; }
.brand h1 { margin: 0; font: 700 23px/1 var(--font-display); letter-spacing: .04em; text-transform: uppercase; }
.tally { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#btn-list { grid-area: btn; }
.search { grid-area: search; position: relative; min-width: 0; }
.search svg { position: absolute; left: 11px; top: 50%; translate: 0 -50%; color: var(--muted); pointer-events: none; }
.search input { width: 100%; height: 40px; padding: 0 12px 0 36px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface-2); font-size: 16px; }
.search input::placeholder { color: var(--muted); }
.results { position: absolute; left: 0; right: 0; top: calc(100% + 6px); margin: 0; padding: 4px; list-style: none;
  max-height: min(55vh, 420px); overflow-y: auto; background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: var(--shadow); }
.results button { width: 100%; display: grid; grid-template-columns: 46px 1fr; gap: 10px; align-items: center;
  padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; }
.results button:hover, .results button:focus-visible { background: var(--surface-2); }
.results .none { padding: 12px 10px; color: var(--muted); font-size: 14px; }

.btn { height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
  font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.small { height: 34px; padding: 0 12px; font-size: 13.5px; }
.btn.danger { color: var(--danger); }
.badge { min-width: 22px; padding: 1px 6px; border-radius: 99px; background: var(--accent); color: var(--accent-ink);
  font: 700 12px/18px var(--font-body); text-align: center; font-variant-numeric: tabular-nums; }

.lotnum { font: 700 22px/1 var(--font-display); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.sub { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rowtext { min-width: 0; display: grid; }
.rowtext b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- map ---------- */
.stage { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--canvas); }
.view { position: absolute; inset: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none; cursor: grab; background: var(--canvas); }
.view:active { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; width: 1600px; height: 1000px; transform-origin: 0 0; }
.world img { display: block; width: 1600px; height: 1000px; max-width: none; pointer-events: none; }

.pins { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.pin { position: absolute; left: 0; top: 0; width: 0; height: 0; }
.pin.off { display: none; }
.pin .dot { position: absolute; left: 0; top: 0; translate: -50% -50%; border-radius: 50%; display: grid; place-items: center;
  font: 700 11px/1 var(--font-body); font-variant-numeric: tabular-nums; }
.pin.empty .dot { width: var(--de); height: var(--de); border: 1.5px solid var(--ring); background: var(--ring-fill); }
.pins[data-z="lo"] .pin.empty:not(.sel) { display: none; }
.pin.met .dot, .pin.waved .dot { width: var(--df); height: var(--df); box-shadow: 0 0 0 2px var(--halo), 0 2px 6px rgba(0,0,0,.35); }
.pin.met .dot { background: var(--accent); color: var(--accent-ink); }
.pin.waved .dot { background: var(--teal); color: var(--teal-ink); }
.pin .dot span { display: none; }
.pins[data-num="1"] .pin.met .dot span, .pins[data-num="1"] .pin.waved .dot span { display: inline; }
.pin.sel .dot { box-shadow: 0 0 0 3px var(--halo), 0 0 0 6px var(--accent); }
.pin.sel.empty .dot { border-color: var(--accent); background: rgba(255,255,255,.35); }

.chip { position: absolute; left: 0; top: calc(var(--df) / 2 + 3px); translate: -50% 0; max-width: 176px; padding: 2px 8px 3px 7px;
  border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.28);
  font: 600 11.5px/1.25 var(--font-body); white-space: nowrap; display: none; }
.chip b { display: flex; align-items: center; gap: 5px; font-weight: 600; }
.chip b::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.pin.waved .chip b::before { background: var(--teal); }
.chip b em { font-style: normal; overflow: hidden; text-overflow: ellipsis; }
.chip i { display: none; font-style: normal; font-weight: 400; font-size: 10.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.pins[data-chips="1"] .pin.met:not(.nochip) .chip, .pins[data-chips="1"] .pin.waved:not(.nochip) .chip { display: block; }
.pins[data-ex="1"] .chip i { display: block; }
.pin.sel { z-index: 2; }

.hint { position: absolute; z-index: 5; left: 50%; top: 12px; translate: -50% 0; max-width: calc(100% - 32px); display: flex; align-items: center; gap: 8px;
  padding: 8px 8px 8px 14px; border-radius: 99px; background: var(--surface); box-shadow: var(--shadow); font-size: 13.5px; }
.hint button { width: 26px; height: 26px; border: 0; border-radius: 50%; background: var(--surface-2); line-height: 1; }
.legend { position: absolute; z-index: 5; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 12px; padding: 6px 12px; border-radius: 99px;
  background: var(--surface); box-shadow: var(--shadow); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.legend i.t { background: var(--teal); }
.zoomctl { position: absolute; z-index: 5; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 6px; }
.zoomctl button { width: 42px; height: 42px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); box-shadow: var(--shadow); font: 500 22px/1 var(--font-body); }
.zoomctl button:hover { background: var(--surface-2); }
.stage.has-sheet .legend, .stage.has-sheet .zoomctl, .stage.has-sheet .hint { display: none; }

/* ---------- sheet ---------- */
.sheet { position: absolute; z-index: 10; left: 0; right: 0; bottom: 0; max-height: 64%; display: flex; flex-direction: column;
  background: var(--surface); border-radius: 16px 16px 0 0; box-shadow: var(--shadow);
  transform: translateY(104%); visibility: hidden; transition: transform .22s ease, visibility 0s linear .22s; }
.sheet.open { transform: none; visibility: visible; transition: transform .22s ease, visibility 0s; }
.grab { width: 38px; height: 4px; margin: 8px auto 0; border-radius: 4px; background: var(--line); flex: none; }
.sheet-head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px 10px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { margin: 0; font: 700 28px/1 var(--font-display); letter-spacing: .03em; text-transform: uppercase; }
.sheet-head p { margin: 3px 0 0; font-size: 13px; color: var(--muted); }
.icon-btn { flex: none; width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--surface-2); font-size: 20px; line-height: 1; }
.icon-btn:hover { background: var(--line); }
.sheet-body { overflow-y: auto; padding: 14px 16px calc(18px + env(safe-area-inset-bottom, 0px)); overscroll-behavior: contain; }

.field { display: grid; gap: 6px; margin: 0 0 14px; padding: 0; border: 0; min-width: 0; }
.field > label, .field > legend, .lbl { padding: 0; font: 600 12px/1 var(--font-display); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.field input[type="text"], .field input[type="date"], .field textarea, .member input {
  width: 100%; min-width: 0; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); font-size: 16px; }
.field textarea { resize: vertical; min-height: 76px; }
.member { display: grid; grid-template-columns: 1fr 1fr 36px; gap: 6px; margin-bottom: 6px; align-items: center; }
.seg { position: relative; display: inline-grid; grid-auto-flow: column; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; width: max-content; max-width: 100%; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { padding: 8px 14px; font-size: 14px; font-weight: 600; background: var(--surface-2); cursor: pointer; }
.seg input:checked + label.l-met { background: var(--accent); color: var(--accent-ink); }
.seg input:checked + label.l-waved { background: var(--teal); color: var(--teal-ink); }
.seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: -2px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { padding: 6px 11px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface-2); font-size: 13.5px; }
.tag[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.sheet-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 4px; }
.state { font-size: 13px; color: var(--muted); }
.state.err { color: var(--danger); }
.note { margin: 0 0 12px; padding: 8px 12px; border-radius: 9px; background: var(--surface-2); color: var(--muted); font-size: 13px; }

.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.list button { width: 100%; display: grid; grid-template-columns: 46px 1fr; gap: 10px; align-items: center; padding: 10px 6px; border: 0;
  border-bottom: 1px solid var(--line); background: transparent; text-align: left; }
.list button:hover { background: var(--surface-2); }
.dotk { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--accent); }
.dotk.t { background: var(--teal); }
.empty-state { padding: 22px 6px; color: var(--muted); }
.empty-state strong { display: block; margin-bottom: 6px; color: var(--ink); font: 700 20px/1.1 var(--font-display); letter-spacing: .03em; text-transform: uppercase; }

@media (min-width: 760px) {
  .top { grid-template-columns: auto minmax(220px, 420px) auto; grid-template-areas: "brand search btn"; justify-content: space-between; align-items: center; }
}
@media (min-width: 900px) {
  .sheet { left: auto; top: 0; width: 392px; max-height: none; border-radius: 0; border-left: 1px solid var(--line);
    transform: translateX(104%); }
  .sheet.open { transform: none; }
  .grab { display: none; }
  .stage.has-sheet .zoomctl { display: grid; right: 404px; }
  .stage.has-sheet .legend { display: flex; }
}
.backup { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
.backup p { margin: 0; color: var(--muted); font-size: 13px; }
.backup textarea { width: 100%; min-height: 84px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2);
  font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; resize: vertical; }
.backup .row { display: flex; flex-wrap: wrap; gap: 8px; }
@media (prefers-reduced-motion: reduce) {
  .sheet, .sheet.open { transition: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top">
    <div class="brand">
      <h1>Keebler Meadows</h1>
      <p class="tally" id="tally" aria-live="polite">Loading neighbors…</p>
    </div>
    <button class="btn" id="btn-list" type="button">Neighbors <span class="badge" id="badge">0</span></button>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Find a lot or neighbor" autocomplete="off" enterkeyhint="search" aria-label="Find a lot number or neighbor">
      <ul class="results" id="results" hidden></ul>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="view" id="view" tabindex="0" role="application" aria-label="Keebler Meadows lot map. Drag to pan, pinch or scroll to zoom, tap a lot to open it.">
      <div class="world" id="world">
        <img id="plat" src="map.jpg" width="1600" height="1000" alt="Aerial site plan of Keebler Meadows showing numbered lots 1 to 167" draggable="false">
      </div>
      <div class="pins" id="pins"></div>
    </div>

    <div class="hint" id="hint"><span>Zoom in, then tap a lot to add who lives there.</span><button type="button" id="hint-x" aria-label="Dismiss tip">×</button></div>
    <div class="legend" id="legend" aria-hidden="true"><span><i></i>Met <b id="n-met">0</b></span><span><i class="t"></i>Waved <b id="n-waved">0</b></span></div>
    <div class="zoomctl">
      <button type="button" id="z-in" aria-label="Zoom in">+</button>
      <button type="button" id="z-out" aria-label="Zoom out">−</button>
      <button type="button" id="z-fit" aria-label="Fit all lots"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M2 6V2h4M16 6V2h-4M2 12v4h4M16 12v4h-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>

    <aside class="sheet" id="sheet" aria-label="Lot details">
      <div class="grab"></div>
      <div class="sheet-head">
        <div class="rowtext"><h2 id="sheet-title">Lot</h2><p id="sheet-sub"></p></div>
        <button type="button" class="icon-btn" id="sheet-close" aria-label="Close">×</button>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </aside>
  </main>
</div>

  }
  function saveNow() {
    clearTimeout(saveTimer);
    if (!dirty || selected == null || !draft) return Promise.resolve();
    var n = +selected, doc = normalize(n), snapshot = JSON.stringify(draft);
    dirty = false;
    if (!doc && !households[n]) { setState(''); return Promise.resolve(); }
    if (doc && !draft.metOn) { draft.metOn = doc.metOn; var mi = $('f-met'); if (mi) mi.value = doc.metOn; snapshot = JSON.stringify(draft); }
    setState('Saving…');
    var prev = inflight[n] || Promise.resolve();
    var job = prev.catch(function () {}).then(function () { return storeReady; }).then(function () { return writeDoc(n, doc); });
    inflight[n] = job;
    return job.then(function () {
      if (selected != null && +selected === n && !dirty) { setState(doc ? 'Saved' : 'Cleared'); var btn = $('btn-clear'); if (btn) btn.hidden = !doc; $('sheet-sub').textContent = doc ? displayName(n) : 'Nobody added yet'; }
    }).catch(function (e) {
      if (JSON.stringify(draft) === snapshot) dirty = true;
      setState(errText(e), true);
    });
  }
  function writeDoc(n, doc) {
    var p;
    if (store.db) {
      var ref = store.db.collection('lots').doc('lot-' + n);
      p = doc ? ref.set(doc) : ref.delete();
    } else {
      p = Promise.resolve();
    }
    return p.then(function () {
      var next = Object.assign({}, households);
      if (doc) next[n] = doc; else delete next[n];
      localStorage.setItem(LS_KEY, JSON.stringify(next));   // throws if the phone refuses, which surfaces as a save error
      households = next;
      refreshAll();
    });
  }

  /* ---------------- list + search ---------------- */
  function rowHtml(n, h, tagName) {
    var who = h ? memberNames(h).join(', ') : '';
    var meta2 = h ? [who, h.address].filter(Boolean).join(' · ') : 'Not added yet';
    return '<button type="button" data-lot="' + n + '"><span class="lotnum">' + n + '</span><span class="rowtext"><b>' +
      (h ? '<i class="dotk' + (h.status === 'waved' ? ' t' : '') + '"></i>' : '') + esc(h ? displayName(n) : 'Lot ' + n) + '</b><span class="sub">' + esc(meta2) + '</span></span></button>';
  }
  function renderList() {
    $('sheet-title').textContent = 'Neighbors';
    var ns = Object.keys(households).map(Number).sort(function (a, b) { return a - b; });
    $('sheet-sub').textContent = ns.length ? ns.length + (ns.length === 1 ? ' household, sorted by lot' : ' households, sorted by lot') : '';
    if (!ns.length) {
      sheetBody.innerHTML = '<div class="empty-state"><strong>No households yet</strong>Zoom into the map and tap a lot to add the family who lives there. Names show up on the map as you add them.</div>' + backupHtml();
      return;
    }
    sheetBody.innerHTML = '<ul class="list">' + ns.map(function (n) { return '<li>' + rowHtml(n, households[n]) + '</li>'; }).join('') + '</ul>' + backupHtml();
  }
  function backupHtml() {
    return '<section class="backup" aria-label="Backup"><span class="lbl">Backup</span>' +
      '<p>Everything is saved on this phone only. Copy a backup now and then, and paste it into Notes or a message to yourself. Paste one back here to restore it.</p>' +
      '<textarea id="bk-text" spellcheck="false" aria-label="Backup text" placeholder="Backup text appears here. Paste a backup here to restore."></textarea>' +
      '<div class="row"><button type="button" class="btn small" id="bk-copy">Copy backup</button>' +
      (navigator.share ? '<button type="button" class="btn small" id="bk-share">Share backup</button>' : '') +
      '<button type="button" class="btn small danger" id="bk-restore">Restore from text</button></div>' +
      '<p class="state" id="bk-state" role="status" aria-live="polite"></p></section>';
  }
  function backupText() { return JSON.stringify({ app: 'keebler-meadows', version: 1, exportedAt: new Date().toISOString(), lots: households }, null, 1); }
  function bkState(msg, err) { var s = $('bk-state'); if (s) { s.textContent = msg; s.classList.toggle('err', !!err); } }
  var restoreArmed = 0;
  function listAction(t) {
    if (t.id === 'bk-copy') {
      var ta = $('bk-text'); ta.value = backupText(); ta.focus(); ta.select();
      var done = function () { bkState('Backup copied. Paste it somewhere safe.'); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, function () { bkState('Select the text above, then copy it.'); });
      else bkState('Select the text above, then copy it.');
    } else if (t.id === 'bk-share') {
      navigator.share({ title: 'Keebler Meadows backup', text: backupText() }).catch(function () {});
    } else if (t.id === 'bk-restore') {
      if (!$('bk-text').value.trim()) { bkState('Paste a backup into the box first.', true); return; }
      if (!restoreArmed) { restoreArmed = 1; t.textContent = 'Tap again to replace my data'; setTimeout(function () { restoreArmed = 0; if (t.isConnected) t.textContent = 'Restore from text'; }, 5000); return; }
      restoreArmed = 0; t.textContent = 'Restore from text';
      var data; try { data = JSON.parse($('bk-text').value); } catch (_) { bkState('That doesn’t look like a backup. Paste the full text and try again.', true); return; }
      if (!data || typeof data.lots !== 'object' || !data.lots) { bkState('That doesn’t look like a backup. Paste the full text and try again.', true); return; }
      var next = {}, count = 0;
      Object.keys(data.lots).forEach(function (n) { if (LOTS[n]) { var d = sanitize(data.lots[n]); if (!isEmptyDoc(d)) { next[n] = d; count++; } } });
      try { localStorage.setItem(LS_KEY, JSON.stringify(next)); } catch (_) { bkState('Couldn’t restore. Storage may be full or blocked.', true); return; }
      households = next; refreshAll();
      bkState('Restored ' + count + (count === 1 ? ' household.' : ' households.'));
    }
  }
  $('btn-list').addEventListener('click', function () {
    if (sheet.classList.contains('open') && sheet.dataset.mode === 'list') { closeSheet(); return; }
    flushSave(); setSelected(null); draft = null; renderList(); showSheet('list'); sheetBody.scrollTop = 0;
  });

  function runSearch() {
    var q = qInput.value.trim().toLowerCase();
    if (!q) { resultsEl.hidden = true; resultsEl.innerHTML = ''; return; }
    var out = [];
    if (/^\d+$/.test(q)) {
      Object.keys(LOTS).forEach(function (n) { if (n.indexOf(q) === 0) out.push(+n); });
      out.sort(function (a, b) { return (String(a) === q ? -1 : 0) - (String(b) === q ? -1 : 0) || a - b; });
    } else {
      Object.keys(households).forEach(function (n) {
        var h = households[n], hay = [h.household, h.address, h.notes, h.tags.join(' '), h.members.map(function (m) { return m.name + ' ' + m.detail; }).join(' ')].join(' ').toLowerCase();
        if (hay.indexOf(q) >= 0) out.push(+n);
      });
      out.sort(function (a, b) { return a - b; });
    }
    out = out.slice(0, 8);
    resultsEl.innerHTML = out.length ? out.map(function (n) { return '<li>' + rowHtml(n, households[n]) + '</li>'; }).join('') : '<li class="none">No match. Try a lot number or a name.</li>';
    resultsEl.hidden = false;
  }
  qInput.addEventListener('input', runSearch);
  qInput.addEventListener('focus', runSearch);
  qInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { var b = resultsEl.querySelector('button'); if (b) b.click(); }
    if (e.key === 'Escape') { qInput.value = ''; runSearch(); qInput.blur(); }
  });
  resultsEl.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    qInput.value = ''; resultsEl.hidden = true; qInput.blur(); openLot(+b.dataset.lot);
  });
  document.addEventListener('pointerdown', function (e) { if (!e.target.closest('.search')) resultsEl.hidden = true; });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && sheet.classList.contains('open')) closeSheet(); });

  /* ---------------- storage ---------------- */
  var resolveReady, storeReady = new Promise(function (r) { resolveReady = r; });
  function loadLocal() {
    try { var raw = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); Object.keys(raw).forEach(function (n) { if (LOTS[n]) households[n] = sanitize(raw[n]); }); } catch (_) {}
    store.db = null; store.ready = true; resolveReady(); refreshAll();
  }
  function onSnap(snap) {
    var next = {};
    snap.docs.forEach(function (d) {
      var m = /^lot-(\d+)$/.exec(d.id); if (!m || !LOTS[m[1]]) return;
      var data = sanitize(d.data()); if (!isEmptyDoc(data)) next[m[1]] = data;
    });
    households = next; store.ready = true; resolveReady(); refreshAll();
  }
  function onErr() { $('tally').textContent = 'Saved neighbors are unavailable right now'; store.readOnly = true; resolveReady(); }
  loadLocal();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (_) {}
  var standalone = (window.navigator.standalone === true) || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  var iosSafari = /iphone|ipad|ipod/i.test(navigator.userAgent) && !standalone;
  if (standalone) { interacted = true; $('hint').hidden = true; }
  else if (iosSafari) $('hint').querySelector('span').textContent = 'To install: tap Share, then Add to Home Screen.';
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
  refreshAll();
})();
</script>
</body>
</html>
